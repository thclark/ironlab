
exclude: '^(docs/|target/|tests/fixtures/|crates/ironlab-text/fonts/)|\.git/|\.tox|\.(svg|xml|patch)$'

default_stages: [pre-commit]

default_install_hook_types: [pre-commit, commit-msg]

fail_fast: true

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=10240']
      - id: check-yaml
      - id: end-of-file-fixer
      - id: no-commit-to-branch
      - id: trailing-whitespace

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5

  # Rust. Local hooks so the toolchain is the one pinned by the repo (rustup), and so
  # each mirrors the CI `lint`, `no-deviations` and `ignore-drift` jobs exactly.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (all targets, all features, -D warnings)
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/octue/conventional-commits
    rev: 0.9.2
    hooks:
      - id: check-commit-message-is-conventional
        stages: [commit-msg]
        args:
          - --maximum-body-line-length=2000

  # Completed last, allowing all others to run mid-rebase
  # or in detached head state if required
  - repo: https://github.com/windpioneers/pre-commit-hooks
    rev: 0.0.5
    hooks:
      - id: check-branch-name
        args:
          - '^main$'
          - '^dev$'
          - '^([a-z][a-z0-9#]*)(-[a-z0-9#]+)*$'
