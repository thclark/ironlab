[package]
name = "ironlab-pdf"
description = "PDF export of IronLAB figures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["pdf", "export", "plotting", "figures", "ironlab"]
categories = ["visualization", "graphics", "science"]

[lints]
workspace = true

[dependencies]
ironlab-ir.workspace = true
ironlab-text.workspace = true
ironlab-scene.workspace = true
# Only `raster-images` is enabled, for `Surface::draw_image` and `Image::from_rgba8`, which embed the raster fallback
# for dense content. Font embedding and subsetting (skrifa, subsetter) and positioned-glyph drawing with copyable
# text (`Surface::draw_glyphs`) are always available; `simple-text` only adds rustybuzz shaping for
# `Surface::draw_text`, which is not used because glyphs arrive already shaped from ironlab-text, and `pdf` adds
# embedding of whole PDF files, which the display list does not use.
krilla = { workspace = true, features = ["raster-images"] }
thiserror.workspace = true

[dev-dependencies]
image.workspace = true
