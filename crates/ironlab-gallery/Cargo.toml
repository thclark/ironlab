[package]
publish = false
name = "ironlab-gallery"
description = "Gallery of IronLAB example figures, with a docs generator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
ironlab.workspace = true
ironlab-viewer.workspace = true
ironlab-pdf.workspace = true
ironlab-text.workspace = true
image.workspace = true
clap.workspace = true

[dev-dependencies]
image.workspace = true
# The browsing test reads the artists of a gallery figure straight from the IR, so that what it expects of the
# browser is worked out independently of the browser.
ironlab-ir.workspace = true
# The decimation entry demonstrates a property of the scene compiler, so its test inspects the compiled scene.
ironlab-scene.workspace = true
