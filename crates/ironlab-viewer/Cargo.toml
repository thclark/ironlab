[package]
name = "ironlab-viewer"
description = "Interactive egui viewer for IronLAB figures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["plotting", "viewer", "egui", "figures", "ironlab"]
categories = ["visualization", "gui", "science"]

[lints]
workspace = true

[[bin]]
name = "ironlab-viewer"
path = "src/main.rs"

[dependencies]
ironlab-ir.workspace = true
ironlab-text.workspace = true
ironlab-pdf.workspace = true
ironlab-canvas.workspace = true
egui.workspace = true
eframe.workspace = true
# wgpu is a direct dependency, pinned in the workspace to the version egui-wgpu builds against, because `GpuCallback`
# hands the device and render pass egui-wgpu gives it to the pipelines of `ironlab-canvas`, which take the workspace's
# wgpu types. A drift between the two would fail to compile there, which is the guard wanted.
wgpu.workspace = true
egui-wgpu = "0.36.2"
rfd.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
# The tests of the window build their hit maps and scene warnings by hand rather than compiling a figure.
ironlab-scene.workspace = true
