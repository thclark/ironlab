name: Docs

# Build the Zensical site, including the gallery rendered by IronLAB itself, and publish it to GitHub Pages as a
# deployment artefact: nothing is committed anywhere. The release workflow calls this one after it has tagged a
# release, so the published site describes the released version; a manual dispatch rebuilds it at any other time.
#
# One-time repository settings: Pages → Source: "GitHub Actions"; custom domain ironlab.org (the CNAME lives in the
# settings, not in the repo, and zensical.toml's site_url must match).

on:
  workflow_dispatch:
  # Called rather than dispatched, because a release workflow cannot start another workflow: an event raised with a
  # workflow's own token does not trigger one. Calling also keeps the site's build in the release run, where a failure
  # to publish the documentation is visible beside the release that failed to document itself.
  workflow_call:
    inputs:
      ref:
        description: >-
          The commit, tag or branch to build the site from. Empty, as on a manual dispatch, builds the ref the
          workflow was started on.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer dispatch supersedes one still queued
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release workflow passes the tag it has just created. A pull_request event's own ref is the test merge
          # ref rather than the commit that landed, so the caller must say what to build and cannot be relied on to
          # default to the right thing.
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # The gallery images are rendered offscreen through wgpu; lavapipe provides a software Vulkan adapter.
      - name: Install a software Vulkan adapter
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Generate the gallery and build the site into site/
        run: scripts/build-docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
