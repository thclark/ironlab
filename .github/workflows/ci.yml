name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Both tools are installed below, so tests that need them must fail rather than skip when they are missing.
      IRONLAB_REQUIRE_BUF: "1"
      IRONLAB_REQUIRE_PDF_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Install PDF validators and a software Vulkan adapter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript mesa-vulkan-drivers
      - name: Install PDF validators (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler ghostscript
      # lavapipe is installed above, so on Linux the tests that need a graphics adapter must fail rather than skip
      # when it is missing.
      - name: Test (Linux, adapter required)
        if: runner.os == 'Linux'
        run: cargo test --workspace
        env:
          IRONLAB_REQUIRE_GPU: "1"
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace

  schema:
    # The .proto files of the .fig format are generated from the Rust types rather than committed, so both the files of
    # this revision and those of main are generated here before buf checks them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Generate the .proto files of this revision
        run: cargo run -p ironlab-ir --bin generate-proto
      - name: Lint the .proto files
        working-directory: target/ironlab-proto
        run: buf lint
      - name: Generate the .proto files of main
        id: main
        run: |
          git fetch --no-tags origin main
          git worktree add "$RUNNER_TEMP/main" FETCH_HEAD
          has_generator=0
          if [ -f "$RUNNER_TEMP/main/Cargo.toml" ]; then
            has_generator=$(cargo metadata --manifest-path "$RUNNER_TEMP/main/Cargo.toml" --no-deps --format-version 1 \
              | jq '[.packages[] | select(.name == "ironlab-ir") | .targets[] | select(.name == "generate-proto")] | length')
          fi
          if [ "$has_generator" -eq 0 ]; then
            echo "::notice title=buf breaking skipped::main has no generate-proto binary, so there are no .proto files to compare against."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A separate target directory keeps main's build and generated files apart from this revision's.
          CARGO_TARGET_DIR="$RUNNER_TEMP/main-target" \
            cargo run --manifest-path "$RUNNER_TEMP/main/Cargo.toml" -p ironlab-ir --bin generate-proto
          echo "generated=true" >> "$GITHUB_OUTPUT"
      - name: Check the .proto files for breaking changes against main
        if: steps.main.outputs.generated == 'true'
        working-directory: target/ironlab-proto
        run: buf breaking --against "$RUNNER_TEMP/main-target/ironlab-proto"

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo run -p ironlab-gallery -- export target/gallery
      - uses: wtfjoke/setup-tectonic@v3
      - run: tectonic tests/latex/include.tex

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: scripts/build-docs.sh
