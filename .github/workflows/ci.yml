name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The engine and its browser host must build for the browser, which is what proves that neither has a
      # native-only dependency.
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p ironlab-web -p ironlab-canvas --lib -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Both tools are installed below, so tests that need them must fail rather than skip when they are missing.
      IRONLAB_REQUIRE_BUF: "1"
      IRONLAB_REQUIRE_PDF_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Install PDF validators and a software Vulkan adapter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript mesa-vulkan-drivers
      - name: Install PDF validators (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler ghostscript
      # lavapipe is installed above, so on Linux the tests that need a graphics adapter must fail rather than skip
      # when it is missing.
      - name: Test (Linux, adapter required)
        if: runner.os == 'Linux'
        run: cargo test --workspace
        env:
          IRONLAB_REQUIRE_GPU: "1"
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace

  schema:
    # The schemas are generated from the Rust types and committed in schema/. This job first checks that the committed
    # files equal those generated, then lets the rule-based tools compare them: strands.octue.com compares each
    # single-file JSON Schema with the version last published to its strand, and buf compares the .proto files with
    # those of main. scripts/schema_version.py takes the highest of their requirements as the schema version, and
    # requires SCHEMA_VERSION to equal it on pull requests into main, which is where the version is bumped.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The sticky comment that summarises the schema version is written to the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Test the schema version decision
        run: python3 -m unittest discover -s scripts
      # This is the script that the generate-schemas pre-commit hook runs. It fails when regenerating the schemas
      # changes schema/, which means that a commit changed the Rust types without committing the regenerated files.
      - name: Check that the committed schemas are those generated from the Rust types
        run: |
          if ! scripts/check-schemas.sh; then
            echo "::error title=Stale schemas::The files in schema/ differ from those generated from the Rust types. Run 'pre-commit run generate-schemas --all-files' (or scripts/check-schemas.sh) and commit the regenerated files."
            exit 1
          fi
      - name: Lint the .proto files
        working-directory: schema/proto
        run: buf lint
      - name: Read SCHEMA_VERSION
        id: current
        # The constant is printed by the build that generated the schemas, rather than parsed from the Rust source.
        run: echo "version=$(cargo run --quiet -p ironlab-ir --bin generate-schema -- --print-version)" >> "$GITHUB_OUTPUT"
      - name: Find the .proto files of main
        id: main
        # main's committed .proto files are compared when it has them. Before the schemas were committed, main has
        # none, so they are generated from main's generator instead, when it has one.
        run: |
          git fetch --no-tags origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git worktree add "$RUNNER_TEMP/main" FETCH_HEAD
          if [ -f "$RUNNER_TEMP/main/schema/proto/buf.yaml" ]; then
            echo "against=$RUNNER_TEMP/main/schema/proto" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_generator=0
          if [ -f "$RUNNER_TEMP/main/Cargo.toml" ]; then
            has_generator=$(cargo metadata --manifest-path "$RUNNER_TEMP/main/Cargo.toml" --no-deps --format-version 1 \
              | jq '[.packages[] | select(.name == "ironlab-ir") | .targets[] | select(.name == "generate-proto")] | length')
          fi
          if [ "$has_generator" -eq 0 ]; then
            echo "::notice title=buf breaking skipped::main has no .proto files and no generate-proto binary, so there is nothing to compare against."
            exit 0
          fi
          # A separate target directory keeps main's build and generated files apart from this revision's. main's
          # generator of that time writes into its target directory.
          CARGO_TARGET_DIR="$RUNNER_TEMP/main-target" \
            cargo run --manifest-path "$RUNNER_TEMP/main/Cargo.toml" -p ironlab-ir --bin generate-proto
          echo "against=$RUNNER_TEMP/main-target/ironlab-proto" >> "$GITHUB_OUTPUT"
      - name: Check the .proto files for breaking changes against main
        id: buf
        # A breaking change does not fail this step: it is an input to the required schema version, and the commit
        # declaration is checked below. buf exits with 100 when it finds a breaking change and with 1 when it cannot
        # run at all, which does fail the step.
        working-directory: schema/proto
        env:
          AGAINST: ${{ steps.main.outputs.against }}
        run: |
          if [ -z "$AGAINST" ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          buf breaking --against "$AGAINST" || status=$?
          case "$status" in
            0) echo "result=compatible" >> "$GITHUB_OUTPUT" ;;
            100)
              echo "::notice title=buf breaking::The .proto files are incompatible with those of main, which requires a breaking bump of the schema version."
              echo "result=breaking" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Decide whether the strands can be queried
        id: strands
        if: github.event_name == 'pull_request'
        # A pull request from a fork receives no secrets, so the strands cannot be queried and the schema version is
        # left to the pull request into main that carries the fork's changes. In a pull request from this repository
        # the token must be present, since without it the schema version would go unchecked.
        env:
          TOKEN: ${{ secrets.PUBLISH_STRAND_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::notice title=Schema version not checked::A pull request from a fork has no access to PUBLISH_STRAND_TOKEN, so the strands are not queried."
            echo "query=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error title=Schema version not checked::The repository secret PUBLISH_STRAND_TOKEN is missing, so the strands cannot be queried."
            exit 1
          else
            echo "query=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Suggest the version of the figure strand
        id: figure
        if: steps.strands.outputs.query == 'true'
        uses: octue/publish-strand-version@352218d60bfd184e0fd9143d70ca1390e677ae7a # 1.0.0
        with:
          token: ${{ secrets.PUBLISH_STRAND_TOKEN }}
          account: octue
          name: ironlab-figure
          path: schema/ironlab-figure.schema.json
          allow_beta: true
          suggest_only: true
      - name: Suggest the version of the edit strand
        id: edit
        if: steps.strands.outputs.query == 'true'
        uses: octue/publish-strand-version@352218d60bfd184e0fd9143d70ca1390e677ae7a # 1.0.0
        with:
          token: ${{ secrets.PUBLISH_STRAND_TOKEN }}
          account: octue
          name: ironlab-edit
          path: schema/ironlab-edit.schema.json
          allow_beta: true
          suggest_only: true
      - name: Check SCHEMA_VERSION against the version the rules require
        id: version
        if: steps.strands.outputs.query == 'true'
        # SCHEMA_VERSION is bumped only on pull requests into main, as the workspace version is, so a pull request into
        # a trunk reports the required version without failing.
        env:
          ENFORCE: ${{ github.base_ref == 'main' }}
          CURRENT: ${{ steps.current.outputs.version }}
          FIGURE_LATEST: ${{ steps.figure.outputs.latest_version }}
          FIGURE_SUGGESTED: ${{ steps.figure.outputs.version }}
          FIGURE_CHANGE: ${{ steps.figure.outputs.change }}
          EDIT_LATEST: ${{ steps.edit.outputs.latest_version }}
          EDIT_SUGGESTED: ${{ steps.edit.outputs.version }}
          EDIT_CHANGE: ${{ steps.edit.outputs.change }}
          BUF: ${{ steps.buf.outputs.result }}
        run: |
          enforce=()
          if [ "$ENFORCE" = "true" ]; then
            enforce=(--enforce)
          fi
          python3 scripts/schema_version.py check \
            --current "$CURRENT" \
            --strand ironlab-figure "$FIGURE_LATEST" "$FIGURE_SUGGESTED" "$FIGURE_CHANGE" \
            --strand ironlab-edit "$EDIT_LATEST" "$EDIT_SUGGESTED" "$EDIT_CHANGE" \
            --buf "$BUF" \
            --account octue \
            --comment "$RUNNER_TEMP/schema-version.md" \
            --github-output "$GITHUB_OUTPUT" \
            "${enforce[@]}"
      - name: Summarise the schema version on the pull request
        if: always() && steps.version.outputs.required != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: schema-version
          path: ${{ runner.temp }}/schema-version.md
      - name: Check that a commit declares a breaking change
        # The commit conventions require a BREAKING-CHANGE paragraph in the body of a commit that makes a breaking
        # change, so a breaking change that either tool requires must be declared by a commit of the pull request.
        if: always() && github.event_name == 'pull_request' && steps.buf.outcome == 'success'
        env:
          BREAKING: ${{ steps.version.outputs.breaking == 'true' || steps.buf.outputs.result == 'breaking' }}
          MAIN: ${{ steps.main.outputs.sha }}
        run: |
          if [ "$BREAKING" != "true" ]; then
            exit 0
          fi
          if git log --format=%B "$MAIN..HEAD" | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo "A commit of this pull request declares the breaking change."
          else
            echo "::error title=Undeclared breaking change::The schema change is breaking, but no commit of this pull request declares it with a BREAKING-CHANGE paragraph, as the commit conventions require."
            exit 1
          fi

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo run -p ironlab-gallery -- export target/gallery
      - uses: wtfjoke/setup-tectonic@v3
      - run: tectonic tests/latex/include.tex

  web:
    # The browser host is tested in a real browser, then bundled exactly as a release would bundle it, so that a
    # reviewer can download a pull request's bundle from the run and try it without building anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          # The wasm32 artefacts share nothing with the native jobs' caches, so they get a key of their own.
          key: web
      - uses: ./.github/actions/setup-web
      # .cargo/config.toml names wasm-bindgen-test-runner as the runner for the wasm32 target; it drives the Chrome
      # that the Ubuntu image ships through the chromedriver beside it. CHROMEWEBDRIVER is set by the image in the
      # runner's process environment, so it is expanded by the shell rather than through the `env` context, which
      # holds only the variables a workflow sets itself. The timeout is per test, in seconds; the default of twenty
      # is too short for a first render that compiles shaders in a software rasteriser.
      - name: Test in headless Chrome
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test --locked --target wasm32-unknown-unknown -p ironlab-web
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 180
      - name: Build the bundle
        run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ironlab-web
          path: dist
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # The site serves the browser bundle at /embed/ and the gallery pages load it, so the docs build compiles it.
      - uses: ./.github/actions/setup-web
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: scripts/build-docs.sh
