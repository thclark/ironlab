name: release

# The release runs on a push to main rather than on the closing of a pull request, because the run's ref decides which
# environments it may deploy to. A pull_request event runs on the test merge ref, `refs/pull/<n>/merge`, which the
# `github-pages` environment rejects, since that environment admits deployments from main alone. A push to main runs on
# `refs/heads/main`, which it admits. Since main is protected, every push to it is the merge of a pull request, so this
# trigger misses nothing and fires on nothing else.
on:
  push:
    branches: [main]

permissions:
  # Creating the tag and the release both write repository contents. Reading pull requests lets the job look up the
  # pull request that produced the pushed commit, whose title becomes the release title.
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # The version that was tagged, or empty when this merge left the version alone and nothing was released. The
      # publish job reads it both as a condition and as the ref to publish from.
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag the workspace version and release it
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          # The tag is the bare version, with no `v` prefix, because check-semantic-version generates a git-mkver
          # configuration with an empty tagPrefix and silently ignores any tag that does not match the version verbatim.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists, so this merge did not change the version and there is nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tags and releases are permanent public artefacts, so this only ever creates them: it never forces, moves or
          # deletes one.
          #
          # The body is whatever GitHub generates. Deliberately out of scope: collecting the `BREAKING-CHANGE:`
          # paragraphs of the individual commits into the notes. The convention puts them in commit bodies, and
          # squash-merging means they never reach main as separate commits, so recovering them needs the pull request's
          # commit list from the API. That is a separate piece of work.
          #
          # The title is that of the pull request whose merge produced this commit. The commit subject is the fallback,
          # with the ` (#<n>)` suffix that a squash merge appends removed, for a commit that no pull request claims.
          title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].title // empty' || true)
          if [ -z "$title" ]; then
            title=$(git log -1 --format=%s "$SHA" | sed -E 's/ \(#[0-9]+\)$//')
          fi
          gh release create "$version" --target "$SHA" --title "$title" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    # Publishing belongs to this workflow rather than to a separate one answering the tag, because a tag pushed with a
    # workflow's own token does not start another workflow run: a tag-triggered publish would simply never fire.
    needs: release
    # An empty version means the merge left the version alone, so no tag was created and there is nothing to publish.
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's rather than adding to them, so `contents` is restated here. Publishing
      # only reads the tag it publishes. `id-token` lets the job obtain the OpenID Connect token with which it proves
      # to crates.io which workflow of which repository it is; that proof is what stands in for a stored API token, so
      # no crates.io credential exists in this repository at all.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly what was tagged, rather than whatever main has reached by the time this job starts.
          ref: ${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Exchange this workflow's identity for a short-lived crates.io token
        id: auth
        # The token lasts thirty minutes, and the action revokes it when the job ends.
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Cargo works out the order from the dependency graph and waits for each crate to reach the index before
        # starting the next, so the six are published as ironlab-ir, ironlab-text, ironlab-scene, ironlab-pdf,
        # ironlab-viewer and finally ironlab. `--locked` publishes the dependency versions recorded in Cargo.lock.
        # `ironlab-gallery` sets `publish = false` and is skipped.
        #
        # If this fails part way through, do not simply re-run the job: `--workspace` refuses outright when any member
        # of the workspace is already on the registry, rather than stepping over it. Publish the remainder one at a
        # time instead, with `cargo publish -p <crate>`, which resolves the already-published members from crates.io.
        run: cargo publish --workspace --locked

  docs:
    # The published site describes a released version, so it is rebuilt from the tag rather than from whatever main has
    # reached by now. This runs alongside publication rather than after it, the two being independent: a registry that
    # rejects a crate is no reason to leave the documentation describing the previous release.
    needs: release
    if: needs.release.outputs.version != ''
    # A called workflow receives the permissions its caller grants, so the three the site's deployment needs are
    # granted here: reading the tag, writing the Pages deployment, and the identity token that deployment is made with.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release.outputs.version }}
