name: release

# The release runs on a push to main rather than on the closing of a pull request, because the run's ref decides which
# environments it may deploy to. A pull_request event runs on the test merge ref, `refs/pull/<n>/merge`, which the
# `github-pages` environment rejects, since that environment admits deployments from main alone. A push to main runs on
# `refs/heads/main`, which it admits. Since main is protected, every push to it is the merge of a pull request, so this
# trigger misses nothing and fires on nothing else.
on:
  push:
    branches: [main]

permissions:
  # Creating the tag and the release both write repository contents. Reading pull requests lets the job look up the
  # pull request that produced the pushed commit, whose title becomes the release title.
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # The version that was tagged, or empty when this merge left the version alone and nothing was released. The
      # publish job reads it both as a condition and as the ref to publish from.
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag the workspace version and release it
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          # The tag is the bare version, with no `v` prefix, because check-semantic-version generates a git-mkver
          # configuration with an empty tagPrefix and silently ignores any tag that does not match the version verbatim.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists, so this merge did not change the version and there is nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tags and releases are permanent public artefacts, so this only ever creates them: it never forces, moves or
          # deletes one.
          #
          # The body is whatever GitHub generates. Deliberately out of scope: collecting the `BREAKING-CHANGE:`
          # paragraphs of the individual commits into the notes. The convention puts them in commit bodies, and
          # squash-merging means they never reach main as separate commits, so recovering them needs the pull request's
          # commit list from the API. That is a separate piece of work.
          #
          # The title is that of the pull request whose merge produced this commit. The commit subject is the fallback,
          # with the ` (#<n>)` suffix that a squash merge appends removed, for a commit that no pull request claims.
          title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].title // empty' || true)
          if [ -z "$title" ]; then
            title=$(git log -1 --format=%s "$SHA" | sed -E 's/ \(#[0-9]+\)$//')
          fi
          gh release create "$version" --target "$SHA" --title "$title" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    # Publishing belongs to this workflow rather than to a separate one answering the tag, because a tag pushed with a
    # workflow's own token does not start another workflow run: a tag-triggered publish would simply never fire.
    needs: release
    # An empty version means the merge left the version alone, so no tag was created and there is nothing to publish.
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's rather than adding to them, so `contents` is restated here. Publishing
      # only reads the tag it publishes. `id-token` lets the job obtain the OpenID Connect token with which it proves
      # to crates.io which workflow of which repository it is; that proof is what stands in for a stored API token, so
      # no crates.io credential exists in this repository at all.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly what was tagged, rather than whatever main has reached by the time this job starts.
          ref: ${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Exchange this workflow's identity for a short-lived crates.io token
        id: auth
        # The token lasts thirty minutes, and the action revokes it when the job ends.
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Cargo works out the order from the dependency graph and waits for each crate to reach the index before
        # starting the next, so the seven are published as ironlab-ir, ironlab-text, ironlab-scene, ironlab-pdf,
        # ironlab-canvas, ironlab-viewer and finally ironlab. `--locked` publishes the dependency versions recorded in
        # Cargo.lock.
        # `ironlab-gallery` and `ironlab-web` set `publish = false` and are skipped: the gallery is a tool of this
        # repository, and the browser host is distributed as a bundle rather than as a crate.
        #
        # Cargo has no flag to step over a crate already on the registry (rust-lang/cargo#13397): `--workspace` refuses
        # outright. So each member whose version `cargo info` finds on crates.io is passed to `--exclude`, which lets a
        # job that failed part way through be re-run to publish the remainder.
        run: |
          exclude=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.publish != []) | "\(.name)@\(.version)"' | xargs -I{} sh -c 'cargo info -q --registry crates-io {} >/dev/null 2>&1 && echo --exclude {} || true')
          cargo publish --workspace --locked $exclude

  bundle:
    # The browser bundle is a release asset rather than a crate. A publication that hosts its own interactive figures
    # downloads `ironlab-web-<version>.tar.gz` from the release and unpacks it beside its pages, and a figure embedded
    # that way keeps working whatever ironlab.org later serves at /embed/. The archive holds the contents of `dist/`
    # exactly as scripts/build-web.sh assembles them, with no enclosing directory, so that `tar -xzf` into the chosen
    # directory is the whole installation. A checksum file sits beside it for a host that verifies what it deploys.
    needs: release
    # An empty version means the merge left the version alone, so no tag was created and there is nothing to attach to.
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's rather than adding to them. Uploading an asset writes the release, which
      # is repository contents; nothing else is needed.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Bundle exactly what was tagged, rather than whatever main has reached by the time this job starts.
          ref: ${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - uses: ./.github/actions/setup-web
      - name: Build the bundle
        run: scripts/build-web.sh
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        # `--clobber` replaces an asset of the same name, so that re-running this job after a transient failure
        # succeeds rather than stopping at an asset the failed run had already uploaded. The release itself is never
        # recreated here; only the `release` job creates one, and only once.
        run: |
          set -euo pipefail
          archive="ironlab-web-$VERSION.tar.gz"
          tar -czf "$archive" -C dist .
          sha256sum "$archive" > "$archive.sha256"
          gh release upload "$VERSION" "$archive" "$archive.sha256" --clobber

  docs:
    # The published site describes a released version, so it is rebuilt from the tag rather than from whatever main has
    # reached by now. This runs alongside publication rather than after it, the two being independent: a registry that
    # rejects a crate is no reason to leave the documentation describing the previous release.
    needs: release
    if: needs.release.outputs.version != ''
    # A called workflow receives the permissions its caller grants, so the three the site's deployment needs are
    # granted here: reading the tag, writing the Pages deployment, and the identity token that deployment is made with.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release.outputs.version }}

  strands:
    # The single-file JSON Schemas in schema/ are published to their strands on strands.octue.com, in lockstep: both
    # strands always carry SCHEMA_VERSION. When either schema differs from the version last published to its strand,
    # both are published at SCHEMA_VERSION; when both are unchanged, nothing is. A strand with no published version is
    # published at SCHEMA_VERSION, which is how the first publication sets the baseline. The job answers the push to
    # main rather than the tag, and depends on no other job, so that it neither waits for nor blocks the release: the
    # strands record the schema of main, which a merge may change even when it leaves the workspace version alone. A
    # failed publication fails this job, which marks the release run as failed without undoing the tag, and is
    # recovered by re-running the job, which skips a strand that already holds SCHEMA_VERSION.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The release notes of a strand version are the title of the pull request whose merge produced this commit.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Read SCHEMA_VERSION
        id: current
        # The constant is printed by the build, rather than parsed from the Rust source.
        run: echo "version=$(cargo run --quiet -p ironlab-ir --bin generate-schema -- --print-version)" >> "$GITHUB_OUTPUT"
      - name: Compare the figure schema with the version last published
        id: figure
        uses: octue/publish-strand-version@352218d60bfd184e0fd9143d70ca1390e677ae7a # 1.0.0
        with:
          token: ${{ secrets.PUBLISH_STRAND_TOKEN }}
          account: octue
          name: ironlab-figure
          path: schema/ironlab-figure.schema.json
          allow_beta: true
          suggest_only: true
      - name: Compare the edit schema with the version last published
        id: edit
        uses: octue/publish-strand-version@352218d60bfd184e0fd9143d70ca1390e677ae7a # 1.0.0
        with:
          token: ${{ secrets.PUBLISH_STRAND_TOKEN }}
          account: octue
          name: ironlab-edit
          path: schema/ironlab-edit.schema.json
          allow_beta: true
          suggest_only: true
      - name: Decide which strands to publish
        id: decide
        # The version is SCHEMA_VERSION, which the schema job of the CI workflow held to the version the rules require.
        # A version that does not exceed one already published to a strand that would be published means that the
        # check was bypassed, as it is for a pull request from a fork, so the script fails rather than ask strands to
        # publish a version it already holds.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CURRENT: ${{ steps.current.outputs.version }}
          FIGURE_LATEST: ${{ steps.figure.outputs.latest_version }}
          FIGURE_SUGGESTED: ${{ steps.figure.outputs.version }}
          FIGURE_CHANGE: ${{ steps.figure.outputs.change }}
          EDIT_LATEST: ${{ steps.edit.outputs.latest_version }}
          EDIT_SUGGESTED: ${{ steps.edit.outputs.version }}
          EDIT_CHANGE: ${{ steps.edit.outputs.change }}
        run: |
          set -euo pipefail
          python3 scripts/schema_version.py release \
            --current "$CURRENT" \
            --strand ironlab-figure "$FIGURE_LATEST" "$FIGURE_SUGGESTED" "$FIGURE_CHANGE" \
            --strand ironlab-edit "$EDIT_LATEST" "$EDIT_SUGGESTED" "$EDIT_CHANGE" \
            --github-output "$GITHUB_OUTPUT"
          notes=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].title // empty' || true)
          if [ -z "$notes" ]; then
            notes=$(git log -1 --format=%s "$SHA" | sed -E 's/ \(#[0-9]+\)$//')
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      # Each strand is published by a step of its own that runs even when the other failed, so that one strand
      # failing still lets the other publish; a re-run then publishes only the strand that remains.
      - name: Publish the figure schema to its strand
        if: ${{ !cancelled() && steps.decide.outputs.publish-ironlab-figure == 'true' }}
        uses: octue/publish-strand-version@352218d60bfd184e0fd9143d70ca1390e677ae7a # 1.0.0
        with:
          token: ${{ secrets.PUBLISH_STRAND_TOKEN }}
          account: octue
          name: ironlab-figure
          path: schema/ironlab-figure.schema.json
          version: ${{ steps.decide.outputs.version }}
          notes: ${{ steps.decide.outputs.notes }}
          allow_beta: true
      - name: Publish the edit schema to its strand
        if: ${{ !cancelled() && steps.decide.outputs.publish-ironlab-edit == 'true' }}
        uses: octue/publish-strand-version@352218d60bfd184e0fd9143d70ca1390e677ae7a # 1.0.0
        with:
          token: ${{ secrets.PUBLISH_STRAND_TOKEN }}
          account: octue
          name: ironlab-edit
          path: schema/ironlab-edit.schema.json
          version: ${{ steps.decide.outputs.version }}
          notes: ${{ steps.decide.outputs.notes }}
          allow_beta: true
