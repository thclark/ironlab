# .github/actions/setup-web/action.yml
name: Set up the browser toolchain
description: >-
  Install what scripts/build-web.sh and the wasm32 tests need beyond the Rust toolchain: the wasm32-unknown-unknown
  target, wasm-bindgen-cli at exactly the version of the wasm-bindgen crate in Cargo.lock, and binaryen for wasm-opt.
  Run this after dtolnay/rust-toolchain (and after Swatinem/rust-cache, so that the target's artefacts are cached),
  because the wasm-bindgen version is read with `cargo metadata`, which needs cargo on the path and the repository
  checked out.
runs:
  using: composite
  steps:
    - name: Add the wasm32 target
      shell: bash
      run: rustup target add wasm32-unknown-unknown

    - name: Read the wasm-bindgen version from Cargo.lock
      id: version
      shell: bash
      # The same query as scripts/build-web.sh, so that the tool installed here is the one the script accepts.
      # `--locked` refuses a lockfile that no longer matches the manifests rather than rewriting it.
      run: |
        set -euo pipefail
        version=$(cargo metadata --format-version 1 --locked \
          | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique
                   | if length == 1 then .[0] else error("Cargo.lock must hold exactly one version of wasm-bindgen, found \(.)") end')
        echo "wasm_bindgen=$version" >> "$GITHUB_OUTPUT"

    # A prebuilt binary rather than `cargo install`, which would compile wasm-bindgen-cli from source on every run.
    # install-action's `wasm-bindgen` entry downloads the wasm-bindgen-cli release archive, which also carries
    # wasm-bindgen-test-runner, the runner .cargo/config.toml names for `cargo test --target wasm32-unknown-unknown`.
    - name: Install wasm-bindgen-cli ${{ steps.version.outputs.wasm_bindgen }}
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@${{ steps.version.outputs.wasm_bindgen }}

    # A pinned release archive rather than Ubuntu's package, because Ubuntu 24.04 packages binaryen 108, whose `-Oz`
    # rewrites the export `__wbindgen_externrefs` to name the module's function table instead of its externref table.
    # The bindings then fail to grow that table when the module initialises, and no figure on a page can start.
    # Version 133 is the one the bundle is developed against; scripts/build-web.sh checks that every bundle it builds
    # initialises, so an upgrade that breaks the module fails the build rather than a published page.
    - name: Install binaryen
      shell: bash
      env:
        BINARYEN_VERSION: "133"
        BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      run: |
        set -euo pipefail
        archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$archive"
        echo "$BINARYEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Report the installed versions
      shell: bash
      run: |
        wasm-bindgen --version
        wasm-opt --version
