[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/thclark/ironlab"
authors = ["Tom Clark"]

[workspace.dependencies]
ironlab-ir = { path = "crates/ironlab-ir", version = "0.3.1" }
ironlab-text = { path = "crates/ironlab-text", version = "0.3.1" }
ironlab-scene = { path = "crates/ironlab-scene", version = "0.3.1" }
ironlab-pdf = { path = "crates/ironlab-pdf", version = "0.3.1" }
ironlab-viewer = { path = "crates/ironlab-viewer", version = "0.3.1" }
ironlab = { path = "crates/ironlab", version = "0.3.1" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
thiserror = "2.0.20"
harfrust = "0.13.3"
ttf-parser = "0.25.1"
latex-rust = { version = "=1.0.2", default-features = false }
kurbo = "0.13.1"
krilla = { version = "0.8.2", default-features = false }
lyon = "1.0.19"
lyon_algorithms = "1.0.21"
egui = "0.36.2"
eframe = "0.36.2"
egui_tiles = "0.17.1"
egui_kittest = "0.36.2"
rfd = "0.17.2"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
proptest = "1.11.0"
sha2 = "0.10"
prost = "0.14.4"
prost-reflect = "0.16.5"
protox = "0.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
