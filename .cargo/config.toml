# The wasm32 target has one thread whose stack the linker sizes; latex-rust recurses to MAX_NESTING, measured against a
# 2 MiB stack, so the browser build gets four times that. The runner lets `cargo test --target wasm32-unknown-unknown`
# run wasm-bindgen tests in a browser.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]
runner = "wasm-bindgen-test-runner"
